backend:
  name: github
  repo: ogaloraphael8-cmyk/rebrand
  branch: main
  auth_type: pkce
  app_id: Ov23li2tHSXSnjXbBz7t
  base_url: https://haldenconsulting.co.ke

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: blog
    label: Blog
    folder: content/blog
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - name: title
        label: Title
        widget: string
      - name: date
        label: Date
        widget: datetime
      - name: thumbnail
        label: Thumbnail
        widget: image
        required: false
      - name: body
        label: Body
        widget: markdown

  - name: pages
    label: Pages
    folder: content/pages
    create: true
    fields:
      - name: title
        label: Title
        widget: string
      - name: body
        label: Body
        widget: markdown
